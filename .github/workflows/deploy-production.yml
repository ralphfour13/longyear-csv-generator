name: Deploy to Production

on:
  push:
    branches: [Production]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'DEPLOYMENT_DOCS_REVIEW.md'
      - 'PROJECT_PRIMER.md'

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  CAPROVER_URL: https://captain.server.four13.dev
  CAPROVER_APP: sage50-journal-entry-sync-prod
  APP_URL: https://sage50-sync.four13.dev

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [typecheck, lint, build]
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

      - name: Upload build artifacts
        if: matrix.check == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  detect-changes:
    name: Detect Configuration Changes
    runs-on: ubuntu-latest
    outputs:
      shopify_changed: ${{ steps.check.outputs.shopify_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Shopify config changes
        id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "shopify.app.toml"; then
            echo "shopify_changed=true" >> $GITHUB_OUTPUT
            echo "✓ Shopify configuration changed - will deploy to Shopify"
          else
            echo "shopify_changed=false" >> $GITHUB_OUTPUT
            echo "✓ No Shopify config changes - skipping Shopify deployment"
          fi

  deploy-caprover:
    name: Deploy to CapRover
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks, detect-changes]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CAPROVER_API_TOKEN: "op://sage50-journal-entry-sync/CAPROVER/api-token"

      - name: Install CapRover CLI
        run: npm install -g caprover

      - name: Authenticate with CapRover
        run: |
          echo "Using API token authentication from 1Password"
          caprover login --caproverPassword "$CAPROVER_API_TOKEN" --caproverUrl "${{ env.CAPROVER_URL }}" --caproverName "four13-cap"

      - name: Create deployment tarball
        run: |
          echo "Creating deployment tarball..."
          tar -czf deploy.tar \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='data' \
            --exclude='build' \
            --exclude='.github' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='deploy.tar' \
            . || true
          ls -lh deploy.tar

      - name: Deploy to CapRover
        run: |
          echo "Deploying to CapRover app: ${{ env.CAPROVER_APP }}"
          caprover deploy \
            --caproverUrl "${{ env.CAPROVER_URL }}" \
            --caproverApp "${{ env.CAPROVER_APP }}" \
            --tarFile deploy.tar 2>&1 | tee deploy.log

          echo "✓ Deployment completed"

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caprover-deployment-logs
          path: deploy.log
          retention-days: 30

  deploy-shopify:
    name: Deploy to Shopify
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.shopify_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SHOPIFY_CLI_TOKEN: op://sage50-journal-entry-sync/SHOPIFY/cli-token
          SHOPIFY_API_SECRET: op://sage50-journal-entry-sync/SHOPIFY/api-secret

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Shopify
        run: |
          echo "Deploying to Shopify..."
          npm run deploy
          echo "✓ Shopify deployment completed"

  post-deployment:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-caprover]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for container restart
        run: |
          echo "Waiting 30 seconds for container to restart..."
          sleep 30

      - name: Health check with retry
        run: |
          echo "Running health check on ${{ env.APP_URL }}/api/healthz"

          MAX_ATTEMPTS=12
          INTERVAL=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS"

            if curl -f -s "${{ env.APP_URL }}/api/healthz" > health_response.json; then
              echo "✓ Health check passed!"
              cat health_response.json | jq '.'
              exit 0
            else
              echo "Health check failed, retrying in ${INTERVAL}s..."
              sleep $INTERVAL
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."

          # Test 1: Homepage
          echo "Testing homepage..."
          if curl -f -s "${{ env.APP_URL }}" > /dev/null; then
            echo "✓ Homepage responding"
          else
            echo "❌ Homepage test failed"
            exit 1
          fi

          # Test 2: Health endpoint
          echo "Testing health endpoint..."
          HEALTH_STATUS=$(curl -s "${{ env.APP_URL }}/api/healthz" | jq -r '.status')
          if [ "$HEALTH_STATUS" = "ok" ]; then
            echo "✓ Health endpoint reports OK status"
          else
            echo "❌ Health endpoint reports non-OK status: $HEALTH_STATUS"
            exit 1
          fi

          echo "✓ All smoke tests passed"

      - name: Upload health check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-results
          path: health_response.json
          retention-days: 7

