# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ec004ce28be778f86415a4b18a7ab9a2"
name = "Sage 50 Sync for Fly Shop"
application_url = "https://sage50.four13.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Required scopes for Sage 50 Journal Entry Sync:
# - read_shopify_payments_payouts: Access payout data (what hit the bank)
# - read_shopify_payments_accounts: Access payment account and balance transactions
# - read_all_orders: Access ALL order details (no 60-day limit) for reconciliation and archived orders
scopes = "read_shopify_payments_payouts,read_shopify_payments_accounts,read_all_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://sage50.four13.dev/auth/callback",
  "https://sage50.four13.dev/auth/shopify/callback"
]
